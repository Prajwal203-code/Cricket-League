<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <rect width="900" height="600" fill="#7B1113"/>
  <!-- Gold Sun and Island / Stumps Emblem -->
  <g transform="translate(450, 300)">
    <circle r="180" fill="#FFCC00" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Palm Tree Island -->
    <path d="M -120 80 Q 0 40 120 80 L 120 120 L -120 120 Z" fill="#008080"/>
    <!-- Cricket Stumps -->
    <rect x="-35" y="-10" width="12" height="70" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <rect x="-6" y="-10" width="12" height="70" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <rect x="23" y="-10" width="12" height="70" fill="#78350f" stroke="#451a03" stroke-width="1"/>
    <!-- Bails -->
    <rect x="-40" y="-16" width="75" height="6" rx="2" fill="#d97706"/>
    <!-- Palm Leaves -->
    <path d="M 0 -20 Q -80 -100 -120 -40 Q -70 -60 0 -20 Q 80 -100 120 -40 Q 70 -60 0 -20" fill="#15803d"/>
    <path d="M 0 -20 Q -40 -120 0 -150 Q 40 -120 0 -20" fill="#16a34a"/>
  </g>
</svg>
