<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <rect width="900" height="600" fill="#0A192F"/>
  <g transform="translate(450, 300)">
    <circle r="180" fill="#1E3A8A" stroke="#38BDF8" stroke-width="8"/>
    <!-- Grid Lines (Latitude & Longitude) -->
    <ellipse rx="180" ry="80" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.6"/>
    <ellipse rx="80" ry="180" fill="none" stroke="#38BDF8" stroke-width="4" opacity="0.6"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#38BDF8" stroke-width="5"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#38BDF8" stroke-width="5"/>
    <!-- Continents Stylized -->
    <circle cx="-50" cy="-40" r="30" fill="#22C55E" opacity="0.8"/>
    <circle cx="60" cy="50" r="40" fill="#22C55E" opacity="0.8"/>
    <circle cx="30" cy="-50" r="25" fill="#22C55E" opacity="0.8"/>
    <circle cx="-60" cy="60" r="25" fill="#22C55E" opacity="0.8"/>
  </g>
</svg>
