<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <rect width="1200" height="600" fill="#00247D"/>
  <!-- Union Jack Canton -->
  <g>
    <clipPath id="cantonClipNZ">
      <rect width="600" height="300"/>
    </clipPath>
    <g clip-path="url(#cantonClipNZ)">
      <rect width="600" height="300" fill="#00247D"/>
      <line x1="0" y1="0" x2="600" y2="300" stroke="#FFFFFF" stroke-width="60"/>
      <line x1="600" y1="0" x2="0" y2="300" stroke="#FFFFFF" stroke-width="60"/>
      <line x1="0" y1="0" x2="600" y2="300" stroke="#CF142B" stroke-width="20"/>
      <line x1="600" y1="0" x2="0" y2="300" stroke="#CF142B" stroke-width="20"/>
      <line x1="300" y1="0" x2="300" y2="300" stroke="#FFFFFF" stroke-width="100"/>
      <line x1="0" y1="150" x2="600" y2="150" stroke="#FFFFFF" stroke-width="100"/>
      <line x1="300" y1="0" x2="300" y2="300" stroke="#CF142B" stroke-width="60"/>
      <line x1="0" y1="150" x2="600" y2="150" stroke="#CF142B" stroke-width="60"/>
    </g>
  </g>
  <!-- Red 5-point stars with white borders -->
  <g transform="translate(900, 300)">
    <!-- Gamma (top) -->
    <g transform="translate(0, -160) scale(0.35)">
      <polygon points="0,-100 59,81 -95,-31 95,-31 -59,81" fill="#CC142B" stroke="#FFFFFF" stroke-width="18"/>
    </g>
    <!-- Alpha (bottom) -->
    <g transform="translate(0, 160) scale(0.38)">
      <polygon points="0,-100 59,81 -95,-31 95,-31 -59,81" fill="#CC142B" stroke="#FFFFFF" stroke-width="18"/>
    </g>
    <!-- Beta (left) -->
    <g transform="translate(-130, -30) scale(0.32)">
      <polygon points="0,-100 59,81 -95,-31 95,-31 -59,81" fill="#CC142B" stroke="#FFFFFF" stroke-width="18"/>
    </g>
    <!-- Delta (right) -->
    <g transform="translate(130, -80) scale(0.32)">
      <polygon points="0,-100 59,81 -95,-31 95,-31 -59,81" fill="#CC142B" stroke="#FFFFFF" stroke-width="18"/>
    </g>
  </g>
</svg>
