<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <!-- Red Top, Blue Bottom -->
  <rect width="900" height="300" fill="#E03C31"/>
  <rect y="300" width="900" height="300" fill="#001489"/>
  <!-- White border for Green Y -->
  <polygon points="0,0 450,300 0,600" fill="#FFFFFF"/>
  <rect y="200" width="900" height="200" fill="#FFFFFF"/>
  <!-- Green Y shape -->
  <polygon points="0,40 390,300 0,560" fill="#007749"/>
  <rect y="240" width="900" height="120" fill="#007749"/>
  <!-- Gold border and Black triangle at hoist -->
  <polygon points="0,80 330,300 0,520" fill="#FFB81C"/>
  <polygon points="0,120 270,300 0,480" fill="#000000"/>
</svg>
